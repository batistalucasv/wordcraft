[package]
name = "wordcraft-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft import/export: plain text, Markdown, HTML, RTF, OpenDocument Text and LaTeX"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-docx = { workspace = true }
craft-wordmodel = { workspace = true }
craft-rtf = { workspace = true }
craft-flow = { workspace = true }
craft-odf = { workspace = true }
craft-markdown = { workspace = true }
craft-html = { workspace = true }
craft-latex = { workspace = true }
craft-math = { workspace = true }
craft-mime = { workspace = true }
craft-sheet = { workspace = true }
craft-ods = { workspace = true }
craft-xls = { workspace = true }
craft-xlsx = { workspace = true }
craft-zip = { workspace = true }
wordcraft-geom = { workspace = true, features = ["image"] }
craft-metafile = { workspace = true }
encoding_rs = { workspace = true }
chardetng = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
# Password-protected ODT (ODF 1.3 Part 2 §3.4): AES-256-CBC, SHA-1/SHA-256, PBKDF2 (HMAC-SHA-1).
[dev-dependencies]
wordcraft-doc = { workspace = true, features = ["test-support"] }
craft-image-codecs = { workspace = true }
proptest = { workspace = true }
